name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-sintaxis:
    runs-on: ubuntu-latest
    # PostGIS desechable para tests/test_integracion_postgres.py (A12/T01):
    # cada corrida crea y borra su propia base dentro de este servidor.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MOTOSAFE_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile backend/main.py backend/migrar.py backend/evaluar_extractor_prensa.py
      # Instalación limpia con las versiones fijadas (A22) y tests sin base de
      # datos: incluye tests/test_entorno.py, que falla si el modelo guardado
      # no coincide con la versión de scikit-learn declarada.
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
