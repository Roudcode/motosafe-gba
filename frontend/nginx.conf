server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador habla siempre con su mismo origen. Nginx reenvía /api a
    # FastAPI y evita CORS, hosts locales hardcodeados y contenido mixto.
    #
    # API_UPSTREAM_SCHEME/API_UPSTREAM (SES-169): en Compose/Render con
    # Private Service, la API vive en la red interna y se habla por HTTP
    # plano con su hostname corto. Desplegando ambos como Web Services
    # públicos gratuitos en Render (sin Postgres propio, con Supabase como
    # base), API_UPSTREAM pasa a ser el hostname público de la API
    # (p.ej. motosafe-api.onrender.com) y hay que hablarle por HTTPS -- de
    # ahi el esquema configurable (default http, para no romper Compose) y
    # el resolver explicito, que nginx exige para resolver un hostname que
    # llega en una variable (no se resuelve una sola vez al arrancar).
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 10s;
    location /api/ {
        proxy_pass ${API_UPSTREAM_SCHEME}://${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ${API_UPSTREAM};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React resuelve sus rutas en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
